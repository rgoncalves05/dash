<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASH — Agenda Cultural — Mockup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -ms-overflow-style:none; scrollbar-width:none; }
  *::-webkit-scrollbar { display:none; }
  body { font-family:'Inter',sans-serif; background:#050e1a; min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; }
  .phone-frame { width:100%; max-width:430px; height:100vh; max-height:932px; position:relative; overflow:hidden; border-radius:0; box-shadow:none; }
  @media (min-width:500px) {
    body { padding:24px 0; }
    .phone-frame { border-radius:48px; box-shadow:0 0 0 10px #0d1f3c, 0 0 0 11px #1e3a5f, 0 40px 80px rgba(0,0,0,.8); height:calc(100vh - 48px); max-height:900px; }
  }
  .phone { width:100%; height:100%; overflow:hidden; background:#0a1628; position:relative; }
  .status-bar { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:12px; color:#fff; font-weight:600; }
  .screen { height:calc(100% - 44px); display:flex; flex-direction:column; position:relative; transition:opacity .3s; overflow:hidden; }
  .screen-scroll { flex:1; overflow-y:auto; display:flex; flex-direction:column; }
  .screen.hidden { display:none; }
  .top-logo-bar { height:44px; display:flex; align-items:center; padding:0 16px; flex-shrink:0; }
  .top-logo-center { display:flex; align-items:center; }
  .top-logo-bar .top-logo-text { font-family:'Playfair Display',serif; font-size:24px; font-weight:200; color:#fff; letter-spacing:8px; line-height:1; }
  .top-logo-bar .top-logo-text i { font-style:italic; font-weight:100; }
  .top-logo-bar .top-tribo-badge { margin-left:auto; display:flex; align-items:center; gap:5px; background:#12233d; border-radius:20px; padding:4px 10px; font-size:12px; cursor:pointer; border:1px solid #1e3a5f; }
  /* Tab bar */
  .tab-bar { position:absolute; bottom:0; left:0; right:0; height:70px; background:linear-gradient(to top,#0a1628 80%,transparent); display:flex; justify-content:space-around; align-items:center; padding-bottom:8px; z-index:10; }
  .tab-btn { background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; opacity:.6; transition:all .2s; color:#94a3b8; }
  .tab-btn.active { opacity:1; transform:scale(1.1); }
  .tab-btn svg { width:22px; height:22px; color:#cbd5e1; }
  .tab-btn.active svg { stroke:#3b82f6; color:#3b82f6; }
  .tab-btn span { font-size:10px; color:#94a3b8; }
  .tab-btn.active span { color:#3b82f6; font-weight:700; }
  /* Categories */
  .cat-bar { display:flex; gap:0; padding:6px 12px; overflow-x:hidden; justify-content:space-between; }
  .cat-chip { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; flex:1; padding:6px 4px; border-radius:14px; border:1px solid #1e3a5f; background:transparent; cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif; color:#94a3b8; margin:0 3px; }
  .cat-chip span.cat-label { font-size:8px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; }
  .cat-chip.active { background:var(--cat-color-bg); border-color:var(--cat-color); color:var(--cat-color); font-weight:600; }
  .cat-chip svg { width:16px; height:16px; color:inherit; }
  .sub-bar { display:flex; gap:8px; padding:4px 16px 8px; overflow-x:auto; }
  .sub-chip { padding:5px 12px; border-radius:12px; border:none; cursor:pointer; font-size:11px; font-weight:500; white-space:nowrap; flex-shrink:0; background:#12233d; color:#94a3b8; transition:all .2s; font-family:'Inter',sans-serif; }
  .sub-chip.active { background:#3b82f6; color:#fff; }
  /* Event cards */
  .event-list { flex:1; overflow:auto; padding:0 16px 80px; display:flex; flex-direction:column; gap:10px; }
  .event-card { display:flex; gap:12px; padding:12px; background:#12233d; border-radius:16px; border:none; cursor:pointer; width:100%; text-align:left; transition:transform .15s; }
  .event-card:hover { transform:scale(1.02); }
  .event-img { width:72px; height:96px; border-radius:12px; background:#1e3a5f; overflow:hidden; flex-shrink:0; }
  .event-img img { width:100%; height:100%; object-fit:cover; }
  .event-info { flex:1; min-width:0; }
  .event-title { font-size:15px; font-weight:600; color:#fff; margin-bottom:3px; }
  .event-genre { font-size:11px; color:#94a3b8; margin-bottom:6px; }
  .event-rating { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
  .event-rating svg { width:12px; height:12px; fill:#f59e0b; stroke:#f59e0b; }
  .event-rating span { font-size:12px; color:#f59e0b; font-weight:600; }
  .event-meta { display:flex; gap:8px; flex-wrap:wrap; }
  .event-meta .date { font-size:11px; color:#64748b; display:flex; align-items:center; gap:3px; }
  .event-meta .price { font-size:11px; color:#22c55e; font-weight:600; display:flex; align-items:center; gap:3px; }
  /* Detail screen */
  .detail-hero { height:260px; background:#0a1628; position:relative; overflow:hidden; }
  .detail-hero img { width:100%; height:100%; object-fit:cover; opacity:.75; }
  .detail-hero .gradient { position:absolute; bottom:0; left:0; right:0; height:60%; background:linear-gradient(transparent,#0a1628); }
  .detail-hero .back-btn, .detail-hero .save-btn { position:absolute; top:12px; background:rgba(0,0,0,.5); border:none; border-radius:20px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; color:#fff; }
  .detail-hero .back-btn { left:12px; }
  .detail-hero .save-btn { right:12px; }
  .detail-hero .save-btn.saved { background:#3b82f6; }
  .detail-body { padding:20px; padding-bottom:100px; overflow:auto; flex:1; }
  .detail-title { font-size:22px; font-weight:700; color:#fff; }
  .detail-genre { font-size:13px; color:#94a3b8; margin:4px 0; }
  .info-cards { display:flex; gap:8px; margin:16px 0; }
  .info-card { flex:1; background:#12233d; border-radius:12px; padding:10px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
  .info-card svg { width:16px; height:16px; }
  .info-card span { font-size:10px; color:#fff; line-height:1.3; }
  .detail-desc.clamp { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .rg-pin{width:30px;height:30px;border-radius:50%;background:var(--pc,#3b82f6);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .rg-pin.in{box-shadow:0 0 0 4px rgba(255,255,255,.95),0 2px 8px rgba(0,0,0,.5)}
  .rg-pin.out{opacity:.4;filter:grayscale(1)}
  .rg-me{position:relative;width:26px;height:26px}
  .rg-me b{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.6)}
  .rg-me i{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:rgba(59,130,246,.45);animation:rgpulse 1.8s ease-out infinite}
  @keyframes rgpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
  .rg-btn{flex:1;border:1px solid #1e3a5f;background:#12233d;color:#cbd5e1;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
  .rg-btn.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
  .ver-mais { background:none; border:none; color:#3b82f6; font-size:13px; font-weight:600; cursor:pointer; padding:0 0 18px; font-family:'Inter',sans-serif; }
  .event-sess { font-size:11px; color:#22c55e; margin:2px 0; }
  .detail-desc { font-size:14px; color:#94a3b8; line-height:1.6; margin-bottom:20px; }
  .social-actions { display:flex; gap:12px; margin-bottom:20px; }
  .social-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; background:#12233d; border-radius:12px; border:none; cursor:pointer; color:#94a3b8; font-size:12px; font-family:'Inter',sans-serif; transition:all .2s; }
  .social-btn.liked { background:rgba(239,68,68,.13); border:1px solid rgba(239,68,68,.27); color:#ef4444; }
  .cta-btn { width:100%; padding:16px; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; font-size:16px; font-weight:700; border:none; border-radius:16px; cursor:pointer; letter-spacing:.5px; transition:all .3s; font-family:'Inter',sans-serif; }
  .cta-btn.bought { background:#22c55e; }
  /* Ver mais */
  .ver-mais-btn { background:none; border:none; color:#3b82f6; font-size:13px; cursor:pointer; padding:0; font-family:'Inter',sans-serif; }
  .extra-info { background:#0a1628; border-radius:12px; padding:12px 14px; margin-bottom:16px; display:flex; flex-direction:column; gap:7px; }
  .extra-row { display:flex; gap:8px; }
  .extra-label { font-size:11px; color:#64748b; width:90px; flex-shrink:0; }
  .extra-value { font-size:12px; color:#cbd5e1; flex:1; }
  /* Avaliacao */
  .rating-popup { background:#12233d; border-radius:16px; padding:16px; margin-bottom:16px; border:1px solid #1e3a5f; }
  .rating-popup-title { font-size:14px; font-weight:600; color:#fff; margin-bottom:10px; }
  .star-row { display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
  .star-pick { background:none; border:none; cursor:pointer; font-size:28px; transition:transform .15s; }
  .star-pick:hover { transform:scale(1.2); }
  .rating-send-btn { width:100%; padding:10px; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; font-size:14px; font-weight:700; border:none; border-radius:12px; cursor:pointer; font-family:'Inter',sans-serif; }
  /* Botao IA no detalhe */
  .detail-ai-btn { display:flex; align-items:center; gap:8px; width:100%; padding:12px 16px; background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(139,92,246,.15)); border:1px solid rgba(59,130,246,.3); border-radius:14px; color:#93c5fd; font-size:14px; font-weight:600; cursor:pointer; margin-bottom:16px; font-family:'Inter',sans-serif; transition:all .2s; }
  .detail-ai-btn:hover { background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(139,92,246,.25)); }
  /* Tribo selecionavel */
  .tribo-join-btn { padding:7px 12px; border-radius:20px; border:1px solid; font-size:11px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s; }
  /* Mini perfil de usuário */
  .user-profile-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .user-profile-card { background:#0d1f3c; border-radius:24px 24px 0 0; padding:20px 20px 36px; width:100%; max-width:430px; border-top:1px solid #1e3a5f; animation:slideUp .25s ease; }
  .follow-btn { padding:10px 24px; border-radius:20px; border:2px solid #3b82f6; background:transparent; color:#3b82f6; font-size:13px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s; }
  .follow-btn.following { background:#3b82f6; color:#fff; }
  /* Novo Post */
  .new-post-btn { display:flex; align-items:center; gap:10px; background:#12233d; border-radius:16px; padding:12px 14px; margin:0 16px 10px; cursor:pointer; border:1px dashed #1e3a5f; transition:all .2s; }
  .new-post-btn:hover { border-color:#3b82f6; }
  .new-post-btn span { font-size:13px; color:#64748b; }
  .post-compose { position:fixed; bottom:0; left:0; right:0; background:#0d1f3c; border-radius:20px 20px 0 0; padding:20px; z-index:100; border-top:1px solid #1e3a5f; animation:slideUp .3s ease; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .post-compose-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .post-compose-title { font-size:16px; font-weight:700; color:#fff; }
  .post-compose-close { background:none; border:none; font-size:22px; color:#64748b; cursor:pointer; }
  .post-compose textarea { width:100%; background:#12233d; border:1px solid #1e3a5f; border-radius:14px; padding:12px 14px; color:#fff; font-size:14px; font-family:'Inter',sans-serif; resize:none; outline:none; min-height:90px; margin-bottom:10px; }
  .post-compose-footer { display:flex; justify-content:space-between; align-items:center; }
  .post-char { font-size:12px; color:#64748b; }
  .post-submit-btn { padding:10px 24px; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; font-size:14px; font-weight:700; border:none; border-radius:12px; cursor:pointer; font-family:'Inter',sans-serif; }
  /* Comments */
  .comments-section { margin-bottom:20px; }
  .comments-title { font-size:16px; font-weight:700; color:#fff; margin-bottom:12px; }
  .comments-title span { font-size:13px; font-weight:400; color:#64748b; }
  .comment-card { background:#12233d; border-radius:14px; padding:14px; margin-bottom:10px; }
  .comment-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .comment-avatar { width:32px; height:32px; border-radius:16px; background:#1e3a5f; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .comment-user { font-size:13px; font-weight:600; color:#fff; }
  .comment-time { font-size:11px; color:#64748b; margin-left:8px; }
  .comment-stars { display:flex; gap:2px; margin-left:auto; }
  .comment-stars svg { width:10px; height:10px; }
  .comment-text { font-size:13px; color:#94a3b8; line-height:1.5; margin-bottom:8px; }
  .comment-likes { display:flex; align-items:center; gap:4px; font-size:11px; color:#64748b; }
  .comment-likes svg { width:12px; height:12px; }
  /* Search */
  .search-input { display:flex; align-items:center; gap:8px; background:#12233d; border-radius:14px; padding:12px 16px; margin:0 16px 8px; }
  .search-input input { flex:1; background:none; border:none; outline:none; color:#fff; font-size:15px; font-family:'Inter',sans-serif; }
  .search-input .clear-btn { background:none; border:none; cursor:pointer; color:#64748b; font-size:18px; }
  .trending-label { font-size:14px; font-weight:600; color:#94a3b8; margin:8px 16px; }
  .trending-chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px; }
  .trending-chip { padding:8px 16px; border-radius:20px; background:#12233d; border:1px solid #1e3a5f; color:#fff; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; }
  .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px; }
  .cat-grid-btn { padding:20px; border-radius:16px; border:1px solid; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cat-grid-btn svg { width:28px; height:28px; }
  .cat-grid-btn span { font-size:13px; font-weight:600; }
  /* Agenda */
  .timeline-item { display:flex; gap:12px; margin-bottom:4px; }
  .timeline-line { display:flex; flex-direction:column; align-items:center; width:20px; }
  .timeline-dot { width:10px; height:10px; border-radius:5px; background:#3b82f6; flex-shrink:0; }
  .timeline-bar { width:2px; flex:1; background:#1e3a5f; }
  .timeline-content { flex:1; padding-bottom:16px; cursor:pointer; }
  .timeline-date { font-size:11px; color:#3b82f6; font-weight:600; }
  .timeline-card { background:#12233d; border-radius:14px; padding:14px; margin-top:6px; display:flex; gap:10px; align-items:center; }
  .timeline-card img { width:44px; height:44px; border-radius:10px; object-fit:cover; }
  .timeline-card .t-title { font-size:14px; font-weight:600; color:#fff; }
  .timeline-card .t-local { font-size:11px; color:#94a3b8; display:flex; align-items:center; gap:4px; margin-top:3px; }
  /* Profile */
  .profile-avatar { width:80px; height:80px; border-radius:40px; background:linear-gradient(135deg,#3b82f6,#8b5cf6); display:flex; align-items:center; justify-content:center; font-size:36px; color:#fff; margin-bottom:12px; overflow:hidden; position:relative; cursor:pointer; }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-avatar-wrap { position:relative; display:inline-block; margin-bottom:12px; cursor:pointer; }
  .profile-avatar-wrap .cam-badge { position:absolute; bottom:2px; right:2px; width:24px; height:24px; background:#3b82f6; border-radius:50%; border:2px solid #0a1628; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .avatar-mini { width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .profile-stats { display:flex; gap:10px; margin-bottom:20px; }
  .stat-box { flex:1; background:#12233d; border-radius:16px; padding:16px 8px; text-align:center; }
  .stat-value { font-size:20px; font-weight:700; color:#3b82f6; }
  .stat-label { font-size:11px; color:#94a3b8; }
  .pref-tag { padding:6px 14px; border-radius:20px; background:rgba(59,130,246,.13); color:#60a5fa; font-size:12px; font-weight:500; border:none; cursor:pointer; }
  .activity-item { display:flex; align-items:center; gap:12px; padding:12px; background:#12233d; border-radius:14px; margin-bottom:8px; cursor:pointer; transition:transform .15s; }
  .activity-item:hover { transform:scale(1.02); }
  .activity-img { width:40px; height:40px; border-radius:10px; overflow:hidden; flex-shrink:0; background:#1e3a5f; }
  .activity-img img { width:100%; height:100%; object-fit:cover; }
  /* Login */
  .login-screen { height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 32px; background:linear-gradient(180deg,#0a1628,#0d1f3c); }
  .login-logo { font-family:'Playfair Display',serif; font-size:48px; font-weight:200; color:#fff; letter-spacing:12px; text-align:center; }
  .login-logo i { font-weight:100; }
  .login-subtitle { font-size:11px; color:#94a3b8; letter-spacing:5px; font-weight:300; text-align:center; margin:6px 0 40px; }
  .login-field { display:flex; align-items:center; gap:10px; padding:14px 16px; background:#12233d; border-radius:14px; margin-bottom:12px; border:1px solid #1e3a5f; }
  .login-field input { flex:1; background:none; border:none; outline:none; color:#fff; font-size:15px; font-family:'Inter',sans-serif; }
  .login-field.shake { animation:shake .4s ease; }
  .login-btn { width:100%; padding:16px; border-radius:14px; border:none; cursor:pointer; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; font-size:16px; font-weight:700; letter-spacing:.5px; margin-bottom:16px; font-family:'Inter',sans-serif; transition:transform .15s; }
  .login-btn:hover { transform:scale(1.02); }
  .login-divider { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .login-divider div { flex:1; height:1px; background:#1e3a5f; }
  .login-divider span { font-size:12px; color:#64748b; }
  .social-logins { display:flex; gap:12px; margin-bottom:24px; }
  .social-login-btn { flex:1; padding:14px; border-radius:14px; border:1px solid #1e3a5f; background:#12233d; cursor:pointer; font-size:13px; font-weight:600; color:#94a3b8; font-family:'Inter',sans-serif; }
  /* Splash */
  .splash-screen { height:100%; position:relative; overflow:hidden; background:radial-gradient(ellipse at center,#0d1f3c,#0a1628 70%); display:flex; align-items:center; justify-content:center; }
  .splash-container { width:100%; height:100%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; animation:fadeOutAll .4s ease 4.6s forwards; }
  .bubble { position:absolute; border-radius:50%; animation:floatBubble 4s ease-in-out infinite; }
  .splash-logo { position:relative; z-index:10; text-align:center; }
  .splash-logo .logo-text { font-family:'Playfair Display',serif; font-size:56px; font-weight:200; color:#fff; letter-spacing:14px; text-shadow:0 0 40px rgba(37,99,235,.3),0 2px 10px rgba(0,0,0,.5); animation:logoReveal 1s ease forwards; }
  .splash-logo .logo-text i { font-weight:100; }
  .splash-logo .logo-sub { font-size:12px; color:rgba(255,255,255,.6); letter-spacing:6px; font-weight:300; animation:subtitleFade .6s ease .8s forwards; opacity:0; }
  /* Header */
  .header-bell { background:#12233d; border:none; border-radius:12px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#cbd5e1; }
  .header { padding:4px 16px 6px; display:flex; justify-content:flex-end; align-items:center; }
  .header-right { display:flex; align-items:center; gap:0; justify-content:space-between; width:100%; }
  .section-title { padding:12px 16px; }
  .section-title h1 { font-size:22px; font-weight:700; color:#fff; }
  .section-title p { font-size:13px; color:#94a3b8; }
  /* Dash.AI */
  .ai-screen { height:100%; display:flex; flex-direction:column; background:radial-gradient(ellipse at center,#0d1f3c,#0a1628 70%); position:relative; }
  .ai-back { position:absolute; top:12px; left:12px; background:rgba(255,255,255,.1); border:none; border-radius:20px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5; color:#cbd5e1; }
  .ai-content { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px; gap:8px; padding-top:40px; padding-bottom:10px; }

{id:30636,title:"100 Dias",genre:"Aventura / Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/100-dias/566367c3-5e8b-4330-b1c9-57cf7faca732.webp",rating:0,price:"R$ 22,80",local:"Cinemark Shopping Iguatemi SP (+18 cinemas)",date:"24/11",desc:"Sozinho em um pequeno barco, Amyr Klink desafia o Atlântico Sul a remo e escreve uma história que nunca havia sido tentada. A travessia entre a África e o Brasil se transforma em uma batalha contra o medo, a solidão e os próprios limites. Enquanto o corpo resiste ao mar, a mente enfrenta memórias, conflitos familiares e escolhas que moldaram quem ele é. Mais do que cruzar um oceano, Amyr precisa atravessar a si mesmo.",extra:{"ano": "2026", "duracao": "116 min", "diretor": "Carlos Saldanha", "produtor": "Disney", "elenco": "Filipe Bragança, Philippine Leroy-Beaulieu, Gero Camilo", "classificacao": "12 anos"}},
{id:33331,title:"A Terra Do Meu Pai",genre:"Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/a-terra-do-meu-pai/8b720f07-03ac-42ba-9091-c4cf1300e892.webp",rating:0,price:"R$ 18,24",local:"Cinema Reserva Cultural São Paulo (+3 cinemas)",date:"24/11",desc:"A Terra do Meu Pai acompanha a complexa relação entre o vencedor do Prêmio Nobel de Literatura Thomas Mann (Hanns Zischler) e sua filha Erika (Sandra Hüller), uma multifacetada atriz, escritora e pilota de rali. No verão de 1949, durante o ápice da Guerra Fria, pai e filha embarcam em uma densa e emocionante road trip a bordo de um Buick preto pelas ruínas da Alemanha, partindo de Frankfurt sob domínio estadunidense até a Weimar sob controle soviético. De volta ao lar após 16 anos de exílio nos EUA, o icônico autor é forçado a confrontar não apenas os destroços de uma nação dividida, mas também as feridas irremediáveis de sua própria família.",extra:{"ano": "2026", "duracao": "82 min", "diretor": "Paweł Pawlikowski", "produtor": "Imovision", "elenco": "Sandra Hüller, Hanns Zischler, August Diehl, Devid Striesow", "classificacao": "12 anos"}},
{id:32656,title:"A Virada - Ignição Da Alma",genre:"Drama / Religião",img:"https://ingresso-a.akamaihd.net/prd/img/movie/a-virada-ignicao-da-alma/0345f955-c89c-4456-b839-ed3af5d4289f.webp",rating:0,price:"R$ 41,04",local:"UCI Anália Franco (+5 cinemas)",date:"24/11",desc:"A Virada: Ignição da Alma é um remake brasileiro do filme dos Irmãos Kendrick, ambientado no Rio de Janeiro. A história acompanha Noah Silva, um vendedor de carros usados carismático, cuja vida começa a desmoronar após sua postura “a qualquer custo” cobrar um preço alto em casa e no trabalho. Confrontado por uma série de alertas, ele embarca em uma jornada de reconciliação e transformação pessoal, na tentativa de recuperar sua integridade e reconstruir a relação com sua esposa e seu filho.",extra:{"ano": "2026", "duracao": "123 min", "diretor": "Alessandro Barros", "produtor": "Heaven Content", "elenco": "Mario Bregieira, Pérola Faria, Gui Tavares, Felipe Folgosi", "classificacao": "10 anos"}},
{id:31533,title:"Cara-De-Barro",genre:"Ação / Aventura / Terror",img:"https://ingresso-a.akamaihd.net/prd/img/movie/cara-de-barro/b7735a9d-3a90-4db1-bb10-a4eb65d213e9.webp",rating:0,price:"R$ 25,65",local:"Cinemark Aricanduva (+11 cinemas)",date:"24/11",desc:"Matt Hagen é um jovem de Gotham cuja rápida ascensão como astro de Hollywood é interrompida quando um criminoso o deixa gravemente desfigurado. Abandonado e desesperado, ele procura um tratamento experimental capaz de restaurar sua aparência. O procedimento funciona, mas provoca consequências inesperadas que afetam sua percepção da realidade e o conduzem por um caminho destrutivo de vingança.",extra:{"ano": "2026", "duracao": "108 min", "diretor": "James Watkins", "produtor": "Warner Bros", "elenco": "Tom Rhys Harries, Naomi Ackie, Max Minghella", "classificacao": "18 anos"}},
{id:32597,title:"Cavalo Selvagem Nove",genre:"Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/cavalo-selvagem-nove/0028ed8d-72cf-472f-a740-1c5037f245f2.webp",rating:0,price:"R$ 22,80",local:"Cinema Belas Artes (+5 cinemas)",date:"24/11",desc:"Pouco antes do golpe de Estado no Chile em 1973, dois agentes da CIA são enviados de Santiago para a Ilha de Páscoa em uma missão de teste de confiança. Entre as famosas estátuas que são o marco da ilha, conhecidas como muais, eles enfrentam passados sombrios e conspirações, enquanto o envolvimento de um dos agentes com estudantes rebeldes ameaça arruinar a viagem. Uma afiada combinação de thriller político, drama existencial e comédia sombria.",extra:{"ano": "2026", "duracao": "116 min", "diretor": "Martin McDonagh", "produtor": "Disney", "elenco": "Sam Rockwell, Parker Posey, Steve Buscemi", "classificacao": "16 anos"}},
{id:34418,title:"Ciência No Cinema - Digger",genre:"Comédia Dramática",img:"https://ingresso-a.akamaihd.net/prd/img/movie/ciencia-no-cinema-digger/1498ed4e-7352-4bad-ab91-750657178278.webp",rating:0,price:"R$ 34,20",local:"Cinema Belas Artes",date:"24/11",desc:"Realizada em parceria com o ICTP-SAIFR, a programação, que tem como foco promover a ciência fora do ambiente acadêmico, exibe mensalmente um filme seguido de debate com professores de física e outras áreas da ciência. Neste mês o filme selecionado é “Digger” (Dir. Alejandro González Iñárritu, 2026, 129 min) e após a exibição haverá um debate com o professor de física Paulo Artaxo e com a escritora e cineasta Gisele Mirabai. Sinopse: Digger Rockwell é o homem mais poderoso do mundo. Determinado a provar que é o salvador da humanidade, ele embarca em uma missão frenética para evitar que o desastre que ele mesmo desencadeou destrua tudo.",extra:{"ano": "2026", "duracao": "129 min", "diretor": "Alejandro González Iñárritu", "produtor": "Sem Distribuidor", "elenco": "Tom Cruise, Sandra Hüller, Riz Ahmed", "classificacao": "14 anos"}},
{id:32937,title:"Como Roubar Um Banco",genre:"Ação / Comédia / Crime / Suspense",img:"https://ingresso-a.akamaihd.net/prd/img/movie/como-roubar-um-banco/d425979c-cf27-49b1-b50e-657417bd8b59.webp",rating:0,price:"R$ 30,78",local:"Cinemark Aricanduva (+6 cinemas)",date:"24/11",desc:"Um grupo de assaltantes extremamente habilidosos transforma seus roubos em espetáculo ao transmitir as ações pelas redes sociais. A fama viral da quadrilha chama a atenção de um veterano agente do FBI e de uma brilhante engenheira de software, que iniciam uma intensa caça digital aos criminosos. Enquanto a perseguição se aproxima, os ladrões planejam seu golpe mais ambicioso.",extra:{"ano": "2026", "duracao": "121 min", "diretor": "David Leitch", "produtor": "Sony Pictures", "elenco": "Nicholas Hoult, Zoë Kravitz, Anna Sawai, John C. Reilly", "classificacao": "16 anos"}},
{id:33252,title:"Contos Paralelos",genre:"Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/contos-paralelos/9b090f0e-a16b-4f00-8ba3-e5be19faca6d.webp",rating:0,price:"R$ 18,24",local:"Cinema Reserva Cultural São Paulo (+3 cinemas)",date:"24/11",desc:"Em busca de inspiração para seu novo romance, Sylvie (Isabelle Huppert), uma escritora francesa em crise criativa, passa os dias observando secretamente os vizinhos do prédio em frente ao seu apartamento em Paris. Tentando recuperar o brilho de seus anos de prestígio, ela transforma a rotina alheia em matéria-prima para sua escrita. Mas, quando contrata Adam (Adam Bessa) para ajudá-la nas tarefas do dia a dia, a linha entre observação e interferência começa a se desfazer, desencadeando consequências inesperadas para ela, seus vizinhos e sua própria ficção.",extra:{"ano": "2026", "duracao": "139 min", "diretor": "Asghar Farhadi", "produtor": "Imovision", "elenco": "Isabelle Huppert, Vincent Cassel, Virginie Efira, Pierre Niney", "classificacao": "14 anos"}},
{id:34313,title:"Deixe-me Viver",genre:"Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/deixe-me-viver/2af5a038-bbef-4ec2-b92f-19cb852cfe92.webp",rating:0,price:"R$ 33,06",local:"Cinemark Shopping D (+3 cinemas)",date:"24/11",desc:"Uma jornada polêmica sobre coragem, culpa, sacrifícios, amor e fé. Ao ser informada que está com um câncer terminal que a manterá num leito até o fim de sua vida, a jovem adolescente Julia implora à Andrea, sua mãe, para que fujam do hospital, interrompendo o tratamento. Seu objetivo: viver o que for possível, até o fim inevitável. Andrea, sempre ausente no dia-a-dia por causa do trabalho, decide jogar tudo para o alto para atender ao apelo. Contra seus medos e culpas, ela se agarra à fé e ao amor visceral, enfrentando o pai de Julia, o hospital e a opinião pública, praticando ortotanásia de forma ilegal. Mas a luta de Andrea dará a Julia a chance de se permitir viver os encantos inesperados que a vida ainda puder lhe trazer. Inclusive uma paixão. Andrea perceberá que, ao resgatar Julia, resgatou a si mesma. Deixe-me Viver é uma jornada sobre a descoberta do verdadeiro valor do tempo ao lado de quem amamos.",extra:{"ano": "2025", "duracao": "103 min", "diretor": "Walther Neto", "produtor": "WN Produções", "elenco": "Mônica Carvalho, Cat Dantas, Humberto Martins, Roberta Rodrigues", "classificacao": "12 anos"}},
{id:31673,title:"Ebenezer E Os Fantasmas Do Natal",genre:"Fantasia",img:"https://ingresso-a.akamaihd.net/prd/img/movie/ebenezer-e-os-fantasmas-do-natal/98773b54-4446-4492-bff6-f33210c15a8a.webp",rating:0,price:"R$ 22,80",local:"Cine Araújo Campo Limpo (+37 cinemas)",date:"24/11",desc:"Uma nova adaptação de \"Um Conto de Natal\", de Charles Dickens. Na véspera de Natal, o avarento Ebenezer Scrooge recebe a visita do fantasma de seu antigo sócio, Jacob Marley, e dos espíritos do Natal Passado, Presente e Futuro. As aparições o obrigam a confrontar sua própria vida e oferecem uma chance de redenção.",extra:{"ano": "2026", "duracao": "117 min", "diretor": "Ti West", "produtor": "Paramount", "elenco": "Johnny Depp, Andrea Riseborough, Ian Mckellen, Tramell Tillman", "classificacao": "12 anos"}},
{id:32254,title:"Eu Sou O Rocky",genre:"Biografia / Drama / Esporte",img:"https://ingresso-a.akamaihd.net/prd/img/movie/eu-sou-o-rocky/95f4371b-f598-41f3-a856-37dcff07c18a.webp",rating:0,price:"R$ 25,65",local:"Cine Araújo Campo Limpo (+41 cinemas)",date:"24/11",desc:"EU SOU O ROCKY conta a incrível história por trás da criação de um dos maiores clássicos do cinema. Antes do sucesso, \"Rocky\" era apenas uma ideia na cabeça de Sylvester Stallone, um ator desconhecido com o rosto parcialmente paralisado e um problema de fala. Quando seu roteiro desperta o interesse de um grande estúdio, Stallone toma uma decisão ousada e recusa a proposta milionária que mudaria sua vida, apostando tudo na chance de protagonizar a história que ele mesmo criou. Uma aposta improvável que o transformou em superstar e mudou para sempre a história do cinema.",extra:{"ano": "2026", "duracao": "128 min", "diretor": "Peter Farrelly", "produtor": "Diamond", "elenco": "Anthony Ippolito, AnnaSophia Robb, Tracy Letts, Matt Dillon", "classificacao": "12 anos"}},
{id:32251,title:"Feito Pipa",genre:"Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/feito-pipa/a13ba546-b66e-4a0c-9c2b-2e28d8fe0ee1.webp",rating:0,price:"R$ 18,24",local:"Cine Tutu (+16 cinemas)",date:"24/11",desc:"Gugu é um menino de 12 anos apaixonado por futebol, que vive com a avó Dilma, uma professora aposentada que o criou de forma livre e afetuosa, em uma vida com segurança e criatividade. Menos em sua relação com o pai Batista, feita de ausências, expectativas e afetos não ditos. Agora Gugu vive seu primeiro desafio quando precisa encarar a possibilidade de morar com ele.",extra:{"ano": "2026", "duracao": "93 min", "diretor": "Allan Deberton", "produtor": "Paris Filmes", "elenco": "Yuri Gomes, Lázaro Ramos, Teca Pereira, Georgina Castro", "classificacao": "14 anos"}},
{id:25476,title:"Fogaréu",genre:"Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/fogareu/cfff3958-ff18-4817-948f-816dcd1065d3.webp",rating:0,price:"R$ 18,24",local:"Cinesystem Belas Artes Frei Caneca (+1 cinemas)",date:"24/11",desc:"Ao retornar à cidade de em que nasceu no interior de Goiás com as cinzas da mãe adotiva, Fernanda confronta segredos familiares e desafia a fachada de uma elite rural conservadora, tornando-se uma ameaça à reeleição de seu tio.",extra:{"ano": "2023", "duracao": "100 min", "diretor": "Flávia Neves", "produtor": "Filmes do Estação", "elenco": "Bárbara Colen, Nena Inoue, Fernanda Vianna, Vilminha Chaves", "classificacao": "16 anos"}},
{id:33172,title:"Godzilla Minus Zero",genre:"Ação / Ficção Científica / Terror",img:"https://ingresso-a.akamaihd.net/prd/img/movie/godzilla-minus-zero/b5b95493-c6e9-4c86-ada4-351e4b39f68a.webp",rating:0,price:"R$ 25,65",local:"Cinemark Móoca (+8 cinemas)",date:"24/11",desc:"A guerra reduziu o Japão a zero, e o Godzilla mergulhou-o no negativo. Passaram-se dois anos desde então, e o país tem enfrentado lutas agonizantes para alcançar a recuperação e, finalmente, voltar à vida normal. No momento em que a humanidade conseguiu se agarrar a uma paz conquistada com dificuldade, surge uma nova ameaça, esmagando a esperança num instante. Não há uma terceira vez. Tudo acaba aqui.",extra:{"ano": "2026", "duracao": "125 min", "diretor": "Takashi Yamazaki", "produtor": "Sato Company", "elenco": "Ryūnosuke Kamiki, Minami Hamabe, Miou Tanaka", "classificacao": "16 anos"}},
{id:33420,title:"I Love Boosters",genre:"Aventura / Comédia / Crime / Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/i-love-boosters/36637f5e-3b15-4aec-bc62-4ef07cd0ed12.webp",rating:0,price:"R$ 18,24",local:"Cinemark Market Place (+6 cinemas)",date:"24/11",desc:"Corvette, uma aspirante a estilista interpretada por Keke Palmer, lidera um grupo de ladras especializadas em furtos de lojas. Quando a poderosa magnata da moda Christie Smith, vivida por Demi Moore, se apropria de uma de suas criações, o grupo organiza uma ação para roubar as roupas da empresária e revendê-las a preços acessíveis, desencadeando um movimento de rebeldia social e crítica ao sistema da moda.",extra:{"ano": "2026", "duracao": "114 min", "diretor": "Boots Riley", "produtor": "Universal Pictures Brasil", "elenco": "Keke Palmer, Taylour Paige, Naomi Ackie, Demi Moore", "classificacao": "16 anos"}},
{id:33519,title:"Jim Queen",genre:"Animação / Comédia / Ficção Científica",img:"https://ingresso-a.akamaihd.net/prd/img/movie/jim-queen/094e52ba-1b4f-4338-9595-ad9f9f286790.webp",rating:0,price:"R$ 22,80",local:"Cinema Belas Artes (+2 cinemas)",date:"24/11",desc:"Jim, ícone sexy da cena queer, vê sua vida virar do avesso quando contrai Heterotopzis, um vírus estranho que transforma homens gays... em héteros. A partir de então, todos viram as costas pra ele – exceto seu último seguidor (e primeiro admirador), Lucien, um jovem franzino e inseguro ainda em busca de autoaceitação. Juntos, eles partirão em busca de um antídoto misterioso capaz de curar Jim e evitar a extinção da sua comunidade.",extra:{"ano": "2026", "duracao": "85 min", "diretor": "Nicolas Athané, Marco Nguyen", "produtor": "Pandora Filmes", "classificacao": "18 anos"}},
{id:29919,title:"Jogos Vorazes: Amanhecer Na Colheita",genre:"Ação / Aventura",img:"https://ingresso-a.akamaihd.net/prd/img/movie/jogos-vorazes-amanhecer-na-colheita/e2aa2ec6-035a-41bf-834a-389a9dd01f4b.webp",rating:0,price:"R$ 22,80",local:"Cine Araújo Campo Limpo (+41 cinemas)",date:"24/11",desc:"\"Jogos Vorazes: Amanhecer Na Colheita\" revisitará o mundo de Panem 24 anos antes dos eventos de Jogos Vorazes, começando na manhã da colheita dos 50º Jogos Vorazes, também conhecida como o Segundo Massacre Quaternário.",extra:{"ano": "2026", "duracao": "159 min", "diretor": "Francis Lawrence", "produtor": "Paris Filmes", "elenco": "Joseph Zada, Mckenna Grace, Ralph Fiennes, Elle Fanning", "classificacao": "16 anos"}},
{id:34108,title:"Josephine - Fragmentos De Um Crime",genre:"Crime / Drama / Thriller",img:"https://ingresso-a.akamaihd.net/prd/img/movie/josephine-fragmentos-de-um-crime/5a470ea3-3696-4c58-8ba6-6bf9d3a3feba.webp",rating:0,price:"R$ 18,24",local:"Cine Tutu (+14 cinemas)",date:"24/11",desc:"Após testemunhar acidentalmente um crime violento, Josephine, uma menina de 8 anos, passa a buscar maneiras de recuperar sua sensação de segurança. Enquanto lida com o trauma, os adultos ao seu redor mostram-se incapazes de confortá-la adequadamente.",extra:{"ano": "2026", "duracao": "119 min", "diretor": "Beth de Araújo", "produtor": "Retrato Filmes", "elenco": "Mason Reeves, Channing Tatum, Gemma Chan, Philip Ettinger", "classificacao": "16 anos"}},
{id:30892,title:"Lago Dos Ossos",genre:"Suspense / Terror",img:"https://ingresso-a.akamaihd.net/prd/img/movie/lago-dos-ossos/437a5140-ee23-4c7c-a24f-9340562c3882.webp",rating:0,price:"R$ 22,80",local:"Playarte Multiplex Marabá",date:"24/11",desc:"Um casal de férias tem sua viagem romântica interrompida quando outro casal— atraente e misterioso — aparece dizendo que alugaram acidentalmente a mesma casa de veraneio isolada à beira do Lago dos Ossos. Eles entram num acordo e decidem compartilhar a mansão, mas tensões inesperadas surgem rapidamente, transformando o retiro íntimo de Sage e Diego numa teia de mentiras e segredos, angústias e pesadelos, sexo e sedução, machado e serra elétrica.",extra:{"ano": "2024", "duracao": "94 min", "diretor": "Mercedes Bryce Morgan", "produtor": "PlayArte", "elenco": "Marco Pigossi, Alex Roe, Maddie Hasson, Andra Nechita", "classificacao": "18 anos"}},
{id:31575,title:"Meu Verão Na Sicília",genre:"Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/meu-verao-na-sicilia/1f34d424-001a-41f2-8917-8cc5079e819a.webp",rating:0,price:"R$ 22,80",local:"Cinema Belas Artes",date:"24/11",desc:"Enviado para passar o verão com uma tia idosa em uma pequena cidade da Sicília, um garoto rebelde descobre um universo guiado por tradições, lendas e mistérios. Entre os choques de gerações, nasce uma relação inesperada que transforma a temporada em uma aventura repleta de descobertas.",extra:{"ano": "2025", "duracao": "90 min", "diretor": "Margherita Spampinato", "produtor": "Pandora Filmes", "elenco": "Marco Fiore, Aurora Quattrocchi, Martina Ziami", "classificacao": "12 anos"}},
{id:33708,title:"Nação Ubuntu - A Voz Dos Silenciados",genre:"Documentário",img:"https://festivaldorio.s3.amazonaws.com/2026/site/ingresso_com/ingresso_cartaz/naoub_p01cor_2026117487.jpg",rating:0,price:"R$ 44,46",local:"UCI Jardim Sul",date:"24/11",desc:"Criado em 1994 com o objetivo de receber dez mil pessoas, o campo de Dzaleka conta com uma população de 44.000 refugiados. São pessoas que fogem de conflitos políticos, religiosos e étnicos de diversos países, majoritariamente da República Democrática do Congo. Vivendo em situação de miséria e vítima de preconceito, os refugiados não têm permissão de sair do campo. Diante desse quadro de abandono, quatro jovens se reuniram para, através do resgate da filosofia Ubuntu, trazer dignidade, trabalho, educação, e acima de tudo, esperança ao povo de Dzaleka.",extra:{"ano": "2026", "duracao": "87 min", "diretor": "Paulo Henrique Fontenelle", "produtor": "Downtown Filmes", "elenco": "Maick Mutej, Prince Kalolo, Felly B. Zihalirwa, Frank Kabamba", "classificacao": "12 anos"}},
{id:32814,title:"O Bosque Selvagem",genre:"Animação / Aventura / Família / Fantasia",img:"https://ingresso-a.akamaihd.net/prd/img/movie/o-bosque-selvagem/2d99712c-5378-4390-a2ad-942d17c03719.webp",rating:0,price:"R$ 30,78",local:"Cinemark Eldorado (+10 cinemas)",date:"24/11",desc:"Existe um bosque escondido logo depois da cidade, um lugar que não aparece em nenhum mapa e de onde dizem que ninguém volta. É para lá que uma revoada de corvos leva o irmão de Prue (Giulia Benite), enviados por uma feiticeira que precisa dele para seus planos sombrios. Sem pensar duas vezes, Prue parte para o Bosque Selvagem para salvá-lo, ao lado do amigo Curtis. Lá dentro, os dois encontram um mundo mágico, cheio de perigos, criaturas encantadas e segredos antigos. Das mãos que criaram Coraline, chega aos cinemas uma história sobre coragem, amizade e os laços que nos movem.",extra:{"ano": "2026", "duracao": "130 min", "diretor": "Travis Knight", "produtor": "Imagem Filmes", "classificacao": "14 anos"}},
{id:30202,title:"Os Farofeiros 3",genre:"Comédia",img:"https://ingresso-a.akamaihd.net/prd/img/movie/os-farofeiros-3/36c1b0fa-425a-456b-803f-c43906152ffe.webp",rating:0,price:"R$ 26,22",local:"Cine Araújo Campo Limpo (+29 cinemas)",date:"24/11",desc:"Desta vez o grupo de amigos viaja ao Caribe, mais precisamente até a ilha de San Sábados — que fica entre as ilhas de San Viernes e San Domingos —, para o casamento de Anita, filha de Rocha.",extra:{"ano": "2026", "duracao": "102 min", "diretor": "Roberto Santucci", "produtor": "Downtown Filmes", "elenco": "Cacau Protásio, Maurício Manfrini, Danielle Winits, Nilton Bicudo", "classificacao": "12 anos"}},
{id:34311,title:"Ramayana: O Nascimento De Uma Lenda",genre:"Drama / Épico / Fantasia",img:"https://ingresso-a.akamaihd.net/prd/img/movie/ramayana-o-nascimento-de-uma-lenda/deecb679-90ef-40f2-b721-1b19511d1beb.webp",rating:0,price:"R$ 33,06",local:"Cinemark Central Plaza (+7 cinemas)",date:"24/11",desc:"Rama é um príncipe cujo destino é marcado pelo sacrifício. Ravana é um rei imortal movido pela vingança. Uma profecia une os destinos dos dois.",extra:{"ano": "2025", "duracao": "166 min", "diretor": "Nitesh Tiwari", "produtor": "Sony Pictures", "elenco": "Ranbir Kapoor, Yash, Sai Pallavi", "classificacao": "14 anos"}},
{id:34419,title:"Sessão Debate: Fiz Um Foguete Imaginando Que Você Vinha",genre:"Drama / Fantasia",img:"https://ingresso-a.akamaihd.net/prd/img/movie/sessao-debate-fiz-um-foguete-imaginando-que-voce-vinha/f6479714-c6e7-4751-bc4c-1959af33f5a1.webp",rating:0,price:"R$ 36,48",local:"Cinesystem Belas Artes Frei Caneca",date:"24/11",desc:"Durante um exame de ressonância magnética, Rosa, uma mulher de 50 anos, é convidada a recordar um momento feliz. Sem conseguir encontrar essa lembrança, embarca em uma viagem delirante pelo próprio inconsciente, onde reencontra sua mãe, Dalva. Juntas, atravessam paisagens reais e imaginárias, reinventando memórias, afetos e possibilidades de reconciliação. A sessão será seguida de debate.",extra:{"ano": "2026", "duracao": "92 min", "diretor": "Janaína Marques", "produtor": "Sem Distribuidor", "classificacao": "Verifique a Classificação"}},
{id:33717,title:"Verão Da Lata",genre:"Comédia / Policial",img:"https://ingresso-a.akamaihd.net/prd/img/movie/verao-da-lata/f2ecde7f-893f-4c4f-91c1-6130fb49a11d.webp",rating:0,price:"R$ 27,36",local:"Cinépolis Itaquera (+7 cinemas)",date:"24/11",desc:"Dirigido por Santiago Dellape, Verão da Lata acompanha o caso que chocou o Rio de Janeiro em 1987. Os policiais Brasa (Babu Santana) e Sandra (Samantha Schmütz) possuem personalidades extremamente opostas, mas terão que se unir no maior caso de suas vidas: uma ameaça vinda do mar. Na história, milhares de latas cheias de maconhas surgem nas margens das praias brasileiras, prestes a transformar o país em um completo caos. Na intenção de interromper a ‘’corrida do ouro verde’’, eles precisarão bater de frente com traficantes, policiais corruptos, jornalistas, malandros e até mesmo jovens que encaram isso como uma oportunidade única de sorte.",extra:{"ano": "2026", "duracao": "85 min", "diretor": "Santiago Dellape", "produtor": "H2O", "elenco": "Samantha Schmütz, Babu Santana, Rafael Saraiva, Humberto Martins", "classificacao": "18 anos"}},
{id:32603,title:"Verity",genre:"Drama",img:"https://ingresso-a.akamaihd.net/prd/img/movie/verity/83e6e325-9e47-49f4-8834-ab9340548ce8.webp",rating:0,price:"R$ 70,67",local:"Kinoplex Parque da Cidade (+1 cinemas)",date:"24/11",desc:"Adaptado do romance best-seller de Colleen Hoover, este thriller psicológico sedutor acompanha a renomada autora Verity Crawford (Anne Hathaway) e Lowen Ashleigh (Dakota Johnson), uma escritora em dificuldades que se muda para a isolada propriedade dos Crawford para escrever como ghostwriter para Verity. Ao descobrir o que parecem ser anotações autobiográficas perturbadoras de Verity, Lowen se vê envolvida em confissões sombrias e distorcidas sobre o marido dela, Jeremy (Josh Hartnett), lutando para distinguir ficção de realidade, manipulação de atração e oportunidade de obsessão.",extra:{"ano": "2026", "duracao": "118 min", "diretor": "Michael Showalter", "produtor": "Sony Pictures", "elenco": "Anne Hathaway, Dakota Johnson, Josh Hartnett, Ismael Cruz Cordova", "classificacao": "16 anos"}}

function posterSvg(t,em,seed){
  let hs=0;for(const c of seed)hs=(hs*31+c.charCodeAt(0))%360;
  const words=t.split(" ");const lines=[];let cur="";
  words.forEach(w=>{if((cur+" "+w).trim().length>15&&cur){lines.push(cur);cur=w;}else cur=(cur+" "+w).trim();});if(cur)lines.push(cur);
  const L=lines.slice(0,4).map((l,i)=>`<text x='150' y='${300+i*30}' font-size='24' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>${l.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/'/g,"&apos;")}</text>`).join("");
  const s=`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hs},60%,38%)'/><stop offset='1' stop-color='hsl(${(hs+60)%360},65%,14%)'/></linearGradient></defs><rect width='300' height='450' fill='url(#g)'/><text x='150' y='215' font-size='110' text-anchor='middle'>${em}</text>${L}</svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}

}

function playBubbleSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    let t=100;
    while(t<4500){
      const delay=t;
      setTimeout(()=>{
        const osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();
        const freq=200+Math.random()*700;
        osc.type="sine";osc.frequency.setValueAtTime(freq,ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq*(1.5+Math.random()),ctx.currentTime+.08);
        filter.type="lowpass";filter.frequency.setValueAtTime(1200,ctx.currentTime);
        const vol=.04+Math.random()*.06;
        gain.gain.setValueAtTime(0,ctx.currentTime);
        gain.gain.linearRampToValueAtTime(vol,ctx.currentTime+.01);
        gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.08+Math.random()*.1);
        osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
        osc.start(ctx.currentTime);osc.stop(ctx.currentTime+.2);
      },delay);
      t+=40+Math.random()*200;
    }
    setTimeout(()=>ctx.close(),5500);
  }catch(e){}
}

function thDist(k){
  const p=TH_GEO[k],R=6371,r=x=>x*Math.PI/180;
  const dLa=r(p[0]-GEO.lat),dLo=r(p[1]-GEO.lng);
  const a=Math.sin(dLa/2)**2+Math.cos(r(GEO.lat))*Math.cos(r(p[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function kmTxt(d){return d.toFixed(1).replace(".",",")+" km";}
function localCard(ev){
  const a=(typeof SESS!=="undefined"&&SESS.S[ev.id])||[];
  const thsAll=[...new Set(a.map(s=>+s.split("|")[1]))];
  const ths=thsAll.filter(k=>inRegion(k));
  if(thsAll.length&&!ths.length)return `<div class="info-card" id="loc-card" style="cursor:pointer" onclick="openRegionMap()"><span style="color:#ef4444">${ic("i-map",16)}</span><span style="display:flex;flex-direction:column;line-height:1.25"><span>Nenhum cinema na sua região</span><span style="font-size:10px;color:#f59e0b">${thsAll.length} cinemas fora dela · toque para ajustar</span></span></div>`;
  if(!ths.length)return `<div class="info-card" id="loc-card" style="cursor:pointer" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${ev.local} São Paulo'),'_blank')"><span style="color:#ef4444">${ic("i-map",16)}</span><span style="text-decoration:underline;text-decoration-color:#ef4444">${ev.local}</span><span style="font-size:10px;color:#ef4444;margin-left:4px">↗</span></div>`;
  ths.sort((x,y)=>thDist(x)-thDist(y));
  const k=ths[0],nm=SESS.T[k][0],more=ths.length-1;
  const ref=GEO.src==="gps"?"de você":GEO.src==="manual"?"do local marcado":"da Av. Paulista (ref.)";
  return `<div class="info-card" id="loc-card" style="cursor:pointer" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${nm} São Paulo'),'_blank')"><span style="color:#ef4444">${ic("i-map",16)}</span><span style="display:flex;flex-direction:column;line-height:1.25"><span style="text-decoration:underline;text-decoration-color:#ef4444">${nm}${more>0?` <span style="color:#94a3b8">(+${more} ${more>1?"cinemas":"cinema"})</span>`:""}</span><span style="font-size:10px;color:#22c55e">📍 mais próximo · ${kmTxt(thDist(k))} ${ref}</span></span><span style="font-size:10px;color:#ef4444;margin-left:4px">↗</span></div>`;
}

let REGION=null;
try{REGION=JSON.parse(localStorage.getItem("dash_region")||"null");if(REGION&&REGION.t)REGION={z:[REGION]};if(REGION&&!(REGION.z&&REGION.z.length))REGION=null;}catch(e){REGION=null;}
function saveRegion(){try{if(REGION)localStorage.setItem("dash_region",JSON.stringify(REGION));else localStorage.removeItem("dash_region");}catch(e){}}
function _hav(a,b,c,d){const r=x=>x*Math.PI/180,x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(x))*1000;}
function _zin(Z,p){
  if(Z.t==="c")return _hav(p[0],p[1],Z.c[0],Z.c[1])<=Z.r;
  let ins=false;const q=Z.p;
  for(let i=0,j=q.length-1;i<q.length;j=i++){const yi=q[i][0],xi=q[i][1],yj=q[j][0],xj=q[j][1];
    if(((yi>p[0])!==(yj>p[0]))&&(p[1]<(xj-xi)*(p[0]-yi)/(yj-yi)+xi))ins=!ins;}
  return ins;
}

function rgOsrmBase(mode){return mode==="car"?"https://routing.openstreetmap.de/routed-car":"https://routing.openstreetmap.de/routed-foot";}
async function rgFetchJson(u){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch(u,{signal:ac.signal});if(!r.ok)throw new Error("http "+r.status);return await r.json();}finally{clearTimeout(t);}

async function rgOsrmTable(pts,mode){
  const co=pts.map(p=>p[1].toFixed(6)+","+p[0].toFixed(6)).join(";");
  const j=await rgFetchJson(rgOsrmBase(mode)+"/table/v1/driving/"+co+"?annotations=distance,duration");
  if(!j||!j.distances||!j.durations)throw new Error("sem matriz");
  return pts.map((a,i)=>pts.map((b,k)=>{
    let d=j.distances[i][k],t=j.durations[i][k];
    if(d==null||t==null){d=_hav(a[0],a[1],b[0],b[1])*1.3;t=d/(mode==="car"?6.9:1.25);}
    return {d:d,t:t};
  }));
}
async function rgOsrmRoute(pts,mode){
  const co=pts.map(p=>p[1].toFixed(6)+","+p[0].toFixed(6)).join(";");
  const j=await rgFetchJson(rgOsrmBase(mode)+"/route/v1/driving/"+co+"?overview=full&geometries=geojson&steps=true");
  if(!j||!j.routes||!j.routes[0])throw new Error("sem rota");
  const r=j.routes[0];
  return {line:r.geometry.coordinates.map(c=>[c[1],c[0]]),legs:r.legs.map(l=>({d:l.distance,t:l.duration,steps:(l.steps||[]).map(x=>({n:x.name||"",d:x.distance,type:x.maneuver.type,mod:x.maneuver.modifier,b:x.maneuver.bearing_after,ex:x.maneuver.exit}))})),tot:{d:r.distance,t:r.duration}};
}
function rgTsp(D){
  const m=D.length-1;if(m<=0)return[];if(m===1)return[1];
  if(m<=12){
    const N=1<<m,dp=new Float64Array(N*m).fill(Infinity),par=new Int8Array(N*m).fill(-1);
    for(let j=0;j<m;j++)dp[(1<<j)*m+j]=D[0][j+1];
    for(let mk=1;mk<N;mk++)for(let j=0;j<m;j++){
      if(!(mk&(1<<j)))continue;const cur=dp[mk*m+j];if(cur===Infinity)continue;
      for(let k=0;k<m;k++){if(mk&(1<<k))continue;const nm=mk|(1<<k),v=cur+D[j+1][k+1];if(v<dp[nm*m+k]){dp[nm*m+k]=v;par[nm*m+k]=j;}}
    }
    let mk=N-1,bj=0,bv=Infinity;for(let j=0;j<m;j++)if(dp[mk*m+j]<bv){bv=dp[mk*m+j];bj=j;}
    const out=[];let j=bj;while(j>=0){out.push(j+1);const pj=par[mk*m+j];mk^=(1<<j);j=pj;}
    return out.reverse();
  }
  const left=new Set();for(let i=1;i<=m;i++)left.add(i);
  let path=[],cur=0;
  while(left.size){let b=-1,bd=Infinity;left.forEach(j=>{if(D[cur][j]<bd){bd=D[cur][j];b=j;}});path.push(b);left.delete(b);cur=b;}
  let imp=true,guard=0;
  while(imp&&guard++<200){imp=false;
    for(let i=0;i<path.length-1;i++)for(let j=i+1;j<path.length;j++){
      const a=i===0?0:path[i-1],b=path[i],c=path[j],d=j+1<path.length?path[j+1]:null;
      const o=D[a][b]+(d!=null?D[c][d]:0),n=D[a][c]+(d!=null?D[b][d]:0);
      if(n<o-1e-6){path=path.slice(0,i).concat(path.slice(i,j+1).reverse(),path.slice(j+1));imp=true;}
    }}
  return path;
}

function rtKm(m){return (m/1000).toFixed(m<10000?1:0).replace(".",",")+" km";}
function rtTime(sec){const mi=Math.round(sec/60);if(mi<60)return mi+" min";const h=Math.floor(mi/60),r=mi%60;return h+" h"+(r?" "+r+" min":"");}
async function rgRouteRun(){
  const my=++RT.seq,mode=RT.mode,st=RT.stops;
  if(RG.rt&&RG.map){try{RG.map.removeLayer(RG.rt);}catch(e){}}RG.rt=null;
  rgRouteCard(null);
  const pts=[[GEO.lat,GEO.lng]].concat(st.map(p=>[p.lat,p.lng]));
  let M=null,est=false;
  try{M=await rgOsrmTable(pts,mode);}catch(e){M=null;}
  if(my!==RT.seq)return;
  if(!M){est=true;M=pts.map(a=>pts.map(b=>{const d=_hav(a[0],a[1],b[0],b[1])*1.3;return{d:d,t:d/(mode==="car"?6.9:1.25)};}));}
  const ord=rgTsp(M.map(r=>r.map(x=>x.d)));
  let legs=[],tot={d:0,t:0},prev=0;
  ord.forEach(i=>{legs.push(M[prev][i]);tot.d+=M[prev][i].d;tot.t+=M[prev][i].t;prev=i;});
  let line=[0].concat(ord).map(i=>pts[i]);
  if(!est){try{const g=await rgOsrmRoute(line,mode);if(my!==RT.seq)return;line=g.line;legs=g.legs;tot=g.tot;}catch(e){if(my!==RT.seq)return;est=true;}}
  if(my!==RT.seq)return;
  const col=mode==="car"?"#3b82f6":"#f59e0b";
  RG.rt=L.layerGroup().addTo(RG.map);
  L.polyline(line,{color:"#fff",weight:8,opacity:.85,interactive:false}).addTo(RG.rt);
  L.polyline(line,{color:col,weight:5,opacity:1,dashArray:est?"8 8":null,interactive:false}).addTo(RG.rt);
  ord.forEach((i,k)=>{const p=st[i-1];L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:'<div style="width:24px;height:24px;border-radius:50%;background:'+col+';color:#fff;border:2px solid #fff;font:700 12px Inter,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.6)">'+(k+1)+'</div>',iconSize:[24,24],iconAnchor:[12,34]}),zIndexOffset:1500}).addTo(RG.rt).on("click",()=>rgCard(p.id));});
  try{const h=document.getElementById("rg-map").clientHeight;RG.map.fitBounds(L.latLngBounds(line.concat([[GEO.lat,GEO.lng]])),{paddingTopLeft:[30,50],paddingBottomRight:[30,Math.round(h*.45)]});}catch(e){}
  rgRouteCard({ord:ord,legs:legs,tot:tot,est:est,mode:mode});
}


function rtDir(b){return ["norte","nordeste","leste","sudeste","sul","sudoeste","oeste","noroeste"][Math.round((((b||0)%360)+360)%360/45)%8];}
function rtDist(m){m=Math.max(10,Math.round(m/10)*10);return m<1000?m+" m":(m/1000).toFixed(1).replace(".",",")+" km";}
function rtOn(n,pr){
  if(!n)return pr==="na"?"em uma via sem nome":"por uma via sem nome";
  const m=/^(largo|viaduto|elevado|túnel|tunel|corredor|minhocão|complexo|parque|pátio)$/i.test(n.split(" ")[0]);
  return (pr==="na"?(m?"no ":"na "):(m?"pelo ":"pela "))+n;
}
function rtNormSteps(a){
  const out=[];
  (a||[]).forEach(x=>{
    const pv=out[out.length-1];
    if(pv&&(x.type==="new name"||x.type==="continue")&&(!x.mod||x.mod==="straight")&&x.n&&x.n===pv.n&&pv.type!=="arrive")pv.d+=x.d;
    else out.push(Object.assign({},x));
  });
  return out;
}
function rtStepLine(x,from,to){
  const dir=rtDir(x.b),len=" por "+rtDist(x.d);
  const md={left:"à esquerda",right:"à direita","slight left":"levemente à esquerda","slight right":"levemente à direita","sharp left":"fechando à esquerda","sharp right":"fechando à direita",straight:"em frente",uturn:"fazendo o retorno"}[x.mod]||"";
  switch(x.type){
    case "depart":return "Saindo "+from+", siga sentido "+dir+" "+rtOn(x.n,"pela")+len;
    case "arrive":return "Chegada: "+to+(md&&x.mod!=="straight"?" (fica "+md+")":"");
    case "turn":return "Vire "+(md||"")+" "+rtOn(x.n,"na")+" e siga sentido "+dir+len;
    case "end of road":return "No fim da via, vire "+(md||"")+" "+rtOn(x.n,"na")+" e siga sentido "+dir+len;
    case "fork":return "Na bifurcação, mantenha-se "+(md||"em frente")+" "+rtOn(x.n,"na")+", sentido "+dir+len;
    case "merge":return "Entre "+rtOn(x.n,"na")+" sentido "+dir+len;
    case "on ramp":return "Pegue o acesso "+(md?md+" ":"")+rtOn(x.n,"na")+", sentido "+dir+len;
    case "off ramp":return "Pegue a saída "+(md?md+" ":"")+rtOn(x.n,"na")+", sentido "+dir+len;
    case "roundabout":case "rotary":case "exit roundabout":case "exit rotary":case "roundabout turn":
      return "Na rotatória, pegue a "+(x.ex?x.ex+"ª ":"")+"saída "+rtOn(x.n,"na")+", sentido "+dir+len;
    default:return (md&&x.mod!=="straight"?"Siga "+md+" ":"Continue ")+rtOn(x.n,"pela")+" sentido "+dir+len;
  }
}
function rtLegLines(r,k,seq){
  const lg=r.legs[k];if(!lg||!lg.steps||!lg.steps.length)return null;
  const from=k===0?(GEO.src==="gps"?"da sua localização":GEO.src==="manual"?"do local marcado":"do ponto de partida (Av. Paulista)"):"de "+seq[k-1].name;
  return rtNormSteps(lg.steps).map(x=>rtStepLine(x,from,seq[k].name));
}

function rgRouteCanvas(){
  const r=RT.last;if(!r)return null;
  const st=RT.stops,seq=r.ord.map(i=>st[i-1]),mode=r.mode||RT.mode,col=mode==="car"?"#3b82f6":"#f59e0b";
  const W=1000,H=1000,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");if(!g)return null;
  const pts=[[GEO.lat,GEO.lng]].concat(seq.map(p=>[p.lat,p.lng]));

  let a0=Math.min(...la),a1=Math.max(...la),o0=Math.min(...lo),o1=Math.max(...lo);
  const kx=Math.cos((a0+a1)/2*Math.PI/180);
  let dx=Math.max((o1-o0)*kx,0.004),dy=Math.max(a1-a0,0.004);
  const pad=110,top=170,bot=110,sc=Math.min((W-2*pad)/dx,(H-top-bot)/dy);
  const cx=(o0+o1)/2,cy=(a0+a1)/2;

  g.strokeStyle="rgba(255,255,255,.05)";g.lineWidth=1;for(let i=0;i<=20;i++){g.beginPath();g.moveTo(i*50,0);g.lineTo(i*50,H);g.stroke();g.beginPath();g.moveTo(0,i*50);g.lineTo(W,i*50);g.stroke();}
  g.fillStyle="#fff";g.font="700 44px sans-serif";g.fillText("Roteiro DASH",40,70);
  g.fillStyle="#94a3b8";g.font="26px sans-serif";g.fillText((mode==="car"?"De carro":"A pé")+" · "+seq.length+" paradas · "+rtKm(r.tot.d)+" · "+rtTime(r.tot.t),40,112);

  g.strokeStyle=col;g.lineWidth=7;g.beginPath();pts.forEach((p,i)=>{i?g.lineTo(X(p[1]),Y(p[0])):g.moveTo(X(p[1]),Y(p[0]));});g.stroke();
  g.fillStyle="#2563eb";g.strokeStyle="#fff";g.lineWidth=5;g.beginPath();g.arc(X(pts[0][1]),Y(pts[0][0]),15,0,7);g.fill();g.stroke();
  g.fillStyle="#fff";g.font="700 22px sans-serif";g.fillText("Partida",X(pts[0][1])+22,Y(pts[0][0])+7);
  seq.forEach((p,k)=>{
    const x=X(p.lng),y=Y(p.lat);
    g.fillStyle=col;g.strokeStyle="#fff";g.lineWidth=4;g.beginPath();g.arc(x,y,20,0,7);g.fill();g.stroke();
    g.fillStyle="#fff";g.font="700 22px sans-serif";g.textAlign="center";g.fillText(String(k+1),x,y+8);g.textAlign="left";
    if(seq.length<=14){g.font="22px sans-serif";const nm=p.name.length>26?p.name.slice(0,25)+"…":p.name;g.lineWidth=5;g.strokeStyle="#0f1d33";g.strokeText(nm,x+26,y+8);g.fillStyle="#e2e8f0";g.fillText(nm,x+26,y+8);}
  });

function rgDrawOn(){
  const box=document.getElementById("rg-map"),m=RG.map;
  m.dragging.disable();
  const prevTA=box.style.touchAction;box.style.touchAction="none";box.style.userSelect="none";
  const tm=e=>{if(e.cancelable&&e.touches&&e.touches.length===1)e.preventDefault();};
  box.addEventListener("touchstart",tm,{passive:false});box.addEventListener("touchmove",tm,{passive:false});
  const ptr=new Set();let pts=[],line=null,on=false;
  const pt=e=>{const r=box.getBoundingClientRect();return m.containerPointToLatLng([e.clientX-r.left,e.clientY-r.top]);};
  const finish=()=>{
    if(!on)return;on=false;if(line){line.remove();line=null;}
    if(pts.length>=5){const step=Math.ceil(pts.length/80);RG.tmp.z.push({t:"p",p:pts.filter((_,i)=>i%step===0).map(p=>[p.lat,p.lng])});}
    pts=[];rgDrawShape();rgPins();
  };
  const dn=e=>{
    if(e.target.closest&&e.target.closest(".leaflet-control"))return;
    ptr.add(e.pointerId);
    if(ptr.size>1){finish();return;}
    on=true;pts=[pt(e)];line=L.polyline(pts,{color:"#22c55e",weight:3}).addTo(m);
    try{box.setPointerCapture(e.pointerId);}catch(x){}
  };
  const mv=e=>{if(!on||!ptr.has(e.pointerId))return;pts.push(pt(e));line.setLatLngs(pts);};
  const up=e=>{ptr.delete(e.pointerId);if(ptr.size===0)finish();};
  box.addEventListener("pointerdown",dn);box.addEventListener("pointermove",mv);
  box.addEventListener("pointerup",up);box.addEventListener("pointercancel",up);
  m.on("zoomstart",finish);
  RG.off=()=>{finish();box.style.touchAction=prevTA||"";box.style.userSelect="";box.removeEventListener("touchstart",tm);box.removeEventListener("touchmove",tm);box.removeEventListener("pointerdown",dn);box.removeEventListener("pointermove",mv);box.removeEventListener("pointerup",up);box.removeEventListener("pointercancel",up);m.off("zoomstart",finish);};
}

function segCats(){return state.searchAll||state.category==="feed"?["filmes","teatro","exposicoes","shows"]:selCats();}
function segEvents(){
  const cs=segCats(),one=cs.length===1&&!state.searchAll;const out=[];
  cs.forEach(c=>{

    ev.forEach(e=>out.push({ev:e,c}));
  });
  return out;
}
function srchNorm(t){return String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function srchHay(e){
  if(e._h)return e._h;
  const x=e.extra||{};
  e._h=srchNorm([e.title,e.genre,e.local,e.desc,(e.gb||[]).join(" "),Object.values(x).map(v=>String(v).replace(/<[^>]*>/g," ")).join(" ")].join(" "));
  return e._h;
}
function srchScope(){
  const cs=segCats();
  const sub=(!state.searchAll&&cs.length===1)?((cs[0]==="filmes"?filmSubs():catSubs(cs[0]))[state.subcat]||"Todos"):"Todos";
  return cs.map(c=>CC[c].em+" "+CC[c].label).join(" · ")+(sub!=="Todos"?" › "+sub:"")+(REGION&&!state.searchAll?" · 📍 sua região":(REGION?" · 📍 região":""));
}

    <div class="event-meta"><span class="date">${ic("i-clock",10)} ${ev.date}</span><span class="price">${ic("i-dollar",10)} ${ev.price}</span></div></div></div>`).join("");
}

function _nz(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function triboFilmes(tid){
  const A=TRIBO_AFF[tid];if(!A)return[];
  return (EVENTS.filmes||[]).filter(e=>typeof SESS!=="undefined"&&SESS.S[e.id]&&SESS.S[e.id].length).map(e=>{
    const gs=(e.genre||"").split("/").map(x=>_nz(x.trim()));
    const txt=_nz(e.title+" "+e.desc);
    let sc=0;const why=[];
    gs.forEach((g,i)=>{if(A.g[g]){sc+=A.g[g]*2;why.push((e.genre.split("/")[i]||g).trim());}});
    let hits=0;const kws=[];
    A.k.forEach(k=>{if(hits<4&&new RegExp("\\b"+k).test(txt)){hits++;sc+=2;kws.push(k.replace(/\\b/g,"").trim());}});
    return {e:e,sc:sc,why:why,kws:kws.slice(0,2),c:filmStats(e.id).c};
  }).sort((a,b)=>b.sc-a.sc||b.c-a.c).slice(0,3);
}
function triboFilmesHtml(t){

function renderStats(app){
  // Radar chart SVG
  const radarLabels=["Filmes","Teatro","Exposicoes","Shows","Social"];
  const radarValues=[0.85,0.55,0.70,0.90,0.60]; // 0-1
  const cx=120,cy=110,R=80;
  const angles=radarLabels.map((_,i)=>(-Math.PI/2)+(2*Math.PI*i/radarLabels.length));
  const gridLevels=[0.25,0.5,0.75,1];
  let radarSvg=`<svg width="240" height="230" viewBox="0 0 240 230">`;
  // Grid
  gridLevels.forEach(lv=>{
    const pts=angles.map(a=>`${cx+R*lv*Math.cos(a)},${cy+R*lv*Math.sin(a)}`).join(" ");
    radarSvg+=`<polygon points="${pts}" fill="none" stroke="#1e3a5f" stroke-width="1"/>`;
  });
  // Axes
  angles.forEach(a=>{
    radarSvg+=`<line x1="${cx}" y1="${cy}" x2="${cx+R*Math.cos(a)}" y2="${cy+R*Math.sin(a)}" stroke="#1e3a5f" stroke-width="1"/>`;
  });
  // Data polygon
  const dataPts=radarValues.map((v,i)=>`${cx+R*v*Math.cos(angles[i])},${cy+R*v*Math.sin(angles[i])}`).join(" ");
  radarSvg+=`<polygon points="${dataPts}" fill="rgba(59,130,246,.2)" stroke="#3b82f6" stroke-width="2"/>`;
  // Dots and labels
  radarValues.forEach((v,i)=>{
    const x=cx+R*v*Math.cos(angles[i]),y=cy+R*v*Math.sin(angles[i]);
    radarSvg+=`<circle cx="${x}" cy="${y}" r="4" fill="#3b82f6"/>`;

function parseAIResponse(text){
  const allEvs=Object.values(EVENTS).flat();
  const eventIds=[];
  const cleanText=text.replace(/\[\[ID:(\d+)\]\]/g,(match,id)=>{
    const eid=parseInt(id);
    if(!eventIds.includes(eid)) eventIds.push(eid);
    return "";
  }).replace(/\s{2,}/g," ").trim();
  const events=eventIds.map(id=>{
    const ev=allEvs.find(e=>e.id===id);
    if(!ev) return null;
    return {id:ev.id,title:ev.title,desc:ev.desc,local:ev.local,hours:ev.date,img:ev.img};
  }).filter(Boolean);
  return {text:cleanText,events:events.length?events:null};
}

function setAITribo(triboId){
  if(state.aiTribo===triboId){state.aiTribo=null;}
  else{state.aiTribo=triboId; aiMessages=[]; aiConversation=[];}
  renderAI(document.getElementById("app"));
}

function renderAI(app){
  const hasChat=aiMessages.length>0;
  const activeTribo=state.aiTribo?TRIBOS.find(t=>t.id===state.aiTribo):null;
  const sphereColor=activeTribo?activeTribo.color:"#2563eb";
  const sphereColorLight=activeTribo?activeTribo.color+"99":"#60a5fa";
  let chatHtml="";
  if(hasChat){
    chatHtml=aiMessages.map(m=>{
      if(m.type==="user") return `<div class="ai-msg-user">${m.text}</div>`;
      let html=`<div class="ai-msg-bot"><div>${m.text}</div>`;
      if(m.events){
        m.events.forEach(ev=>{
          html+=`<div class="ai-ev-card" onclick="openEvent(${ev.id})">
            <img src="${ev.img}" alt="${ev.title}" onerror="this.onerror=null;this.style.display='none';this.parentElement.style.background='linear-gradient(135deg,#1e3a5f,#3b82f6)'">
            <div class="ai-ev-info">
              <div class="ai-ev-title">${ev.title}</div>
              <div class="ai-ev-desc">${ev.desc}</div>
              <div class="ai-ev-meta">${ev.local} · ${ev.hours}</div>
            </div>
          </div>`;
        });
      }
      html+=`</div>`;
      return html;
    }).join("");
    if(aiMessages[aiMessages.length-1].typing){
      chatHtml+=`<div class="ai-msg-bot"><div class="ai-typing"><span></span><span></span><span></span></div></div>`;
    }
  }
  const triboChips=TRIBOS.map(t=>{
    const isActive=state.aiTribo===t.id;
    return `<button class="ai-tribo-chip ${isActive?"active":""}" onclick="setAITribo('${t.id}')" style="${isActive?`border-color:${t.color};color:${t.color};background:${t.color}15`:""}">`
      +`<span class="tribo-dot" style="background:${t.color}"></span>${t.emoji} ${t.name}</button>`;
  }).join("");
  const titleText=activeTribo
    ?`<span>Dash.AI</span> · modo ${activeTribo.emoji} ${activeTribo.name}`
    :`<span>Dash.AI</span> seu guia inteligente`;
  const subtitleText=activeTribo
    ?`Fale comigo no estilo ${activeTribo.name}!`
    :`Como posso te ajudar?`;
  app.innerHTML=`<div class="ai-screen">
    <button class="ai-back" onclick="aiMessages=[];aiConversation=[];state.aiTribo=null;state.screen='app';render()">${ic("i-back",18)}</button>
    <div class="ai-content ${hasChat?"has-chat":""}">
      <div class="ai-sphere-wrap">
        <div class="ai-ring" style="border-color:${sphereColor}33"></div><div class="ai-ring" style="border-color:${sphereColor}22"></div><div class="ai-ring" style="border-color:${sphereColor}11"></div>
        <div class="ai-sphere" style="background:radial-gradient(circle at 35% 35%,${sphereColorLight},${sphereColor} 50%,${sphereColor}44 100%);box-shadow:0 0 60px ${sphereColor}66,0 0 120px ${sphereColor}33,inset 0 -8px 20px rgba(0,0,0,.3),inset 0 8px 20px ${sphereColorLight}"></div>
      </div>
      <div class="ai-title">${titleText}</div>
      <div class="ai-subtitle">${subtitleText}</div>
    </div>
    <div class="ai-tribo-selector">${triboChips}</div>
    ${hasChat?`<div class="ai-chat-area" id="ai-chat">${chatHtml}</div>`:""}
    <div class="ai-input-bar">
      <div class="ai-input">
        <input type="text" placeholder="${activeTribo?`Pergunte no modo ${activeTribo.name}...`:"Pergunte algo sobre eventos..."}" id="ai-q" onkeydown="if(event.key==='Enter')sendAI()">
        <button class="ai-mic">${ic("i-mic",18)}</button>
      </div>
      <button class="ai-send" onclick="sendAI()" style="${activeTribo?`background:linear-gradient(135deg,${sphereColor},${sphereColor}cc)`:""}">${ic("i-send",18)}</button>
    </div>
  </div>`;
  if(hasChat){const c=document.getElementById("ai-chat");if(c)c.scrollTop=c.scrollHeight;}
}

async function sendAI(){
  const input=document.getElementById("ai-q");
  const q=input?input.value.trim():"";
  if(!q) return;
  aiMessages.push({type:"user",text:q});
  aiConversation.push({role:"user",content:q});
  aiMessages.push({type:"bot",typing:true,text:""});
  renderAI(document.getElementById("app"));
  try{
    const resp=await fetch("https://dash-proxy.rgoncalves05.workers.dev",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:512,
        system:buildSystemPrompt(),
        tools:[{"type":"web_search_20250305","name":"web_search"}],
        messages:aiConversation.slice(-6)
      })
    });
    const data=await resp.json();
    if(data.error){throw new Error(data.error.message||"Erro na API");}
    // Extrair texto de qualquer bloco — web search retorna múltiplos blocos mistos
    const raw=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    if(!raw) throw new Error("Resposta vazia");
    aiConversation.push({role:"assistant",content:data.content});
    const parsed=parseAIResponse(raw);
    aiMessages.pop();
    aiMessages.push({type:"bot",text:parsed.text,events:parsed.events});
  }catch(err){
    aiMessages.pop();
    aiMessages.push({type:"bot",text:"Desculpe, tive um problema ao processar sua pergunta. Tente novamente! ("+err.message+")"});
  }
  renderAI(document.getElementById("app"));
}

  h+=`<select onchange="sessSet('bairro',this.value)" style="width:100%;background:#12233d;color:#e2e8f0;border:1px solid #1e3a5f;border-radius:12px;padding:9px 10px;font-size:12px;font-family:'Inter',sans-serif;margin-bottom:10px;outline:none"><option value="">📍 Todos os bairros</option>${bairros.map(b=>`<option value="${b}" ${SS.bairro==b?"selected":""}>${b}</option>`).join("")}</select>`;
  const nx=list.find(s=>!passed(s));
  if(nx)h+=`<a href="${sessUrl(nx)}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;text-decoration:none;background:rgba(34,197,94,.12);border:1px solid #22c55e;border-radius:12px;padding:10px 12px;margin-bottom:12px"><span style="font-size:18px">⚡</span><span style="flex:1;font-size:12px;color:#e2e8f0"><b style="color:#22c55e">${SS.day==0?"Próxima sessão":"Primeira sessão"}</b> · ${nx.time} · ${nx.name}<br><span style="color:#94a3b8">${nx.bairro} · ${sessBRL(nx.price)}</span></span><span style="color:#22c55e;font-size:12px;font-weight:700">Ver →</span></a>`;
  if(!list.length){
    h+=`<div style="background:#12233d;border:1px solid #1e3a5f;border-radius:14px;padding:18px;text-align:center"><div style="font-size:13px;color:#e2e8f0;margin-bottom:4px">Nenhuma sessão com esses filtros</div><div style="font-size:11px;color:#94a3b8;margin-bottom:12px">Tente outro período, formato ou bairro — ou veja o outro dia.</div><button class="sub-chip active" style="padding:8px 16px;font-size:12px" onclick="sessClear()">Limpar filtros</button></div>`;
    return h;
  }
  const chip=(s,withName)=>{const ps=passed(s);return `<a href="${sessUrl(s)}" target="_blank" rel="noopener" title="${s.name} · ${sessTags(s).join(" · ")}" style="text-decoration:none;display:inline-flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 10px;border-radius:10px;background:#0a1628;border:1px solid ${s.vip?"#f59e0b":"#1e3a5f"};${ps?"opacity:.35;":""}"><b style="font-size:13px;color:#fff;${ps?"text-decoration:line-through":""}">${s.time}</b><span style="font-size:9px;color:#94a3b8">${sessBRL(s.price)}</span></a>`;};
  if(SS.mode=="c"){
    const g={};list.forEach(s=>{(g[s.th]=g[s.th]||[]).push(s);});
    Object.keys(g).sort((a,b)=>thDist(+a)-thDist(+b)).forEach(k=>{const a=g[k];
      const tg=[...new Set(a.flatMap(sessTags))];
      h+=`<div style="background:#12233d;border:1px solid #1e3a5f;border-radius:14px;padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-size:13px;color:#fff">${SESS.T[k][0]}</b><span style="font-size:10px;color:#64748b;flex-shrink:0">${a.length} sessões</span></div><div style="font-size:11px;color:#94a3b8;margin:2px 0 8px">📍 ${SESS.T[k][1]} · ${kmTxt(thDist(+k))}${tg.length?" · "+tg.join(" · "):""}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${a.map(s=>chip(s)).join("")}</div></div>`;});
  }else{
    ["Manhã","Tarde","Noite"].forEach(p=>{const a=list.filter(s=>sessPer(s.min)==p);if(!a.length)return;
      h+=`<div style="font-size:11px;font-weight:700;color:#64748b;letter-spacing:.5px;text-transform:uppercase;margin:10px 0 6px">${p} · ${a.length}</div>`;
      a.forEach(s=>{const ps=passed(s);h+=`<a href="${sessUrl(s)}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;text-decoration:none;background:#12233d;border:1px solid #1e3a5f;border-radius:12px;padding:9px 12px;margin-bottom:6px;${ps?"opacity:.35":""}"><b style="font-size:15px;color:#fff;min-width:46px;${ps?"text-decoration:line-through":""}">${s.time}</b><span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</span><span style="font-size:10px;color:#94a3b8">${s.bairro}${sessTags(s).length?" · "+sessTags(s).join(" · "):""}</span></span><span style="font-size:11px;color:#22c55e;font-weight:600">${sessBRL(s.price)}</span></a>`;});});
  }
  h+=`<div style="font-size:10px;color:#64748b;margin-top:8px;line-height:1.4">Amostra de sessões (até 5 por cinema/dia) obtida do Ingresso.com em 24/11. O DASH não vende ingressos: ao tocar num horário você é direcionado à ticketeira.</div>`;
  return h;
}

  ${state.showRating?`<div class="rating-popup">

    <div class="star-row">
      ${[1,2,3,4,5].map(s=>`<button class="star-pick" onclick="state.userRating=${s};render()">${s<=(state.userRating||currentRating)?"⭐":"☆"}</button>`).join("")}

  <button class="back-btn" onclick="state.screen='app';state.liked=false;state.saved=false;state.bought=false;render()">${ic("i-back",20)}</button>
  <button class="save-btn ${state.saved?"saved":""}" onclick="state.saved=!state.saved;render()">${ic("i-bookmark",18)}</button></div>
  <div class="detail-body">
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:4px"><div><div class="detail-title">${ev.title}</div><div class="detail-genre">${ev.genre}</div></div></div>
    ${ratingHtml}
    <div class="info-cards">

    </div>
    ${descHtml(ev.desc)}
    ${sessBox(ev.id)}${tsBox(ev)}
    ${extraHtml}
    ${aiBtn}
    <div class="social-actions">
      <button class="social-btn ${state.liked?"liked":""}" onclick="state.liked=!state.liked;render()">${ic("i-heart",16)} ${state.liked?"Curtido!":"Curtir"}</button>
      <button class="social-btn" onclick="state.showComment=!state.showComment;render()">${ic("i-msg",16)} Comentar</button>
      <button class="social-btn ${state.followedEvents&&state.followedEvents.has(ev.id)?"liked":""}" onclick="(function(){if(state.followedEvents.has(${ev.id})){state.followedEvents.delete(${ev.id});}else{state.followedEvents.add(${ev.id});}render();})()">
        ${ic("i-bell",16)} ${state.followedEvents&&state.followedEvents.has(ev.id)?"Seguindo":"Seguir"}

    ${state.showComment?`<div class="rating-popup">
      <div class="rating-popup-title">Seu comentário</div>
      <div class="star-row">

      </div>
      <textarea id="comment-text" style="width:100%;background:#0a1628;border:1px solid #1e3a5f;border-radius:12px;padding:10px 12px;color:#fff;font-size:13px;font-family:'Inter',sans-serif;resize:none;outline:none;min-height:70px;margin-bottom:10px" placeholder="Escreva sua opinião sobre o evento..."></textarea>
