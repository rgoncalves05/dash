function openDetailAI(evId){
  const all=Object.values(EVENTS).flat();
  const ev=all.find(e=>e.id===evId);
  if(!ev) return;
  aiMessages=[];
  aiConversation=[];
  state.aiTribo=null;
  state.screen="ai";
  state.aiContextEvent=ev;
  // Injeta mensagem inicial
  const initMsg=`Em que posso lhe ajudar sobre "${ev.title}"?`;
  aiMessages.push({type:"bot",text:initMsg});
  aiConversation.push({role:"assistant",content:initMsg});
  render();
}

function openEvent(id){state.descOpen=false;geoAsk();state.screen="detail";state.event=id;state.liked=false;state.saved=false;state.bought=false;state.showExtra=false;state.showRating=false;state.showComment=false;state.commentRating=0;state.userRating=0;state.userRatingDone=!!(userRatings[id]);if(userRatings[id])state.userRating=userRatings[id];render();}

function renderTabBar(){
  const tabs=[{id:"home",icon:"i-home",label:"Início"},{id:"search",icon:"i-search",label:"Buscar"},{id:"calendar",icon:"i-calendar",label:"Agenda"},{id:"profile",icon:"i-user",label:"Perfil"}];
  return `<div class="tab-bar">${tabs.map(t=>`<button class="tab-btn ${state.tab===t.id?"active":""}" onclick="state.tab='${t.id}';render()">${ic(t.icon,22)}<span>${t.label}</span></button>`).join("")}</div>`;
}

function handleAvatarUpload(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    userAvatar=ev.target.result;
    document.getElementById('avatar-options').style.display='none';
    render();
  };
  reader.readAsDataURL(file);
}

function openCamera(){
  // Tenta getUserMedia (funciona em HTTPS/localhost)
  // No Android via file://, usa o input capture como fallback
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    // Fallback: input com capture abre câmera nativa no Android/iOS
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.capture='user';
    inp.onchange=e=>handleAvatarUpload(e);
    inp.click(); return;
  }

  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})
    .then(stream=>{
      // Câmera disponível — abre overlay
      const overlay=document.createElement('div');
      overlay.id='camera-overlay';
      overlay.style.cssText='position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px';

      const video=document.createElement('video');
      video.autoplay=true; video.playsinline=true;
      video.style.cssText='width:100%;max-width:400px;border-radius:20px;transform:scaleX(-1)';
      video.srcObject=stream;

      const canvas=document.createElement('canvas');
      canvas.style.display='none';

      const btnRow=document.createElement('div');
      btnRow.style.cssText='display:flex;gap:16px';

      const snapBtn=document.createElement('button');
      snapBtn.textContent='📸 Tirar foto';
      snapBtn.style.cssText='padding:14px 28px;background:#3b82f6;color:#fff;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif';

      const cancelBtn=document.createElement('button');
      cancelBtn.textContent='✕ Cancelar';
      cancelBtn.style.cssText='padding:14px 20px;background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:16px;font-size:15px;cursor:pointer;font-family:Inter,sans-serif';

      const closeCamera=()=>{
        stream.getTracks().forEach(t=>t.stop());
        document.body.removeChild(overlay);
      };

      cancelBtn.onclick=closeCamera;

      snapBtn.onclick=()=>{
        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
        const ctx=canvas.getContext('2d');
        ctx.translate(canvas.width,0); ctx.scale(-1,1);
        ctx.drawImage(video,0,0);
        const size=Math.min(canvas.width,canvas.height);
        const x=(canvas.width-size)/2; const y=(canvas.height-size)/2;
        const cropCanvas=document.createElement('canvas');
        cropCanvas.width=300; cropCanvas.height=300;
        cropCanvas.getContext('2d').drawImage(canvas,x,y,size,size,0,0,300,300);
        userAvatar=cropCanvas.toDataURL('image/jpeg',0.85);
        closeCamera();
        render();
      };

      btnRow.appendChild(cancelBtn);
      btnRow.appendChild(snapBtn);
      overlay.appendChild(video);
      overlay.appendChild(canvas);
      overlay.appendChild(btnRow);
      document.body.appendChild(overlay);
    })
    .catch(()=>{
      // Sem permissão ou HTTPS — usa câmera nativa via input capture
      const inp=document.createElement('input');
      inp.type='file'; inp.accept='image/*'; inp.capture='user';
      inp.onchange=e=>handleAvatarUpload(e);
      inp.click();
    });
}

function openUserProfile(userName){
  const prof=USER_PROFILES[userName];
  if(!prof) return;
  const isFollowing=following.has(prof.id);
  // Remove overlay anterior se existir
  const prev=document.getElementById('user-profile-overlay');
  if(prev) prev.remove();

  const overlay=document.createElement('div');
  overlay.id='user-profile-overlay';
  overlay.className='user-profile-overlay';
  overlay.onclick=e=>{ if(e.target===overlay) overlay.remove(); };

  overlay.innerHTML=`<div class="user-profile-card">
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:52px;height:52px;border-radius:50%;background:#1e3a5f;display:flex;align-items:center;justify-content:center;font-size:26px">${prof.avatar}</div>
        <div>
          <div style="font-size:16px;font-weight:700;color:#fff">${userName}</div>
          <div style="font-size:12px;color:#64748b">${prof.tribo}</div>
        </div>
      </div>
      <button class="follow-btn ${isFollowing?'following':''}" id="follow-btn-${prof.id}"
        onclick="toggleFollow('${prof.id}','${userName}',this)">
        ${isFollowing?"✓ Seguindo":"+ Seguir"}
      </button>
    </div>
    <p style="font-size:13px;color:#94a3b8;margin-bottom:16px;line-height:1.5">${prof.bio}</p>
    <div style="display:flex;gap:24px;padding:12px 0;border-top:1px solid #1e3a5f;border-bottom:1px solid #1e3a5f;margin-bottom:16px">
      <div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#fff">${prof.eventos}</div><div style="font-size:10px;color:#64748b;letter-spacing:1px;text-transform:uppercase">Eventos</div></div>
      <div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#fff">${prof.posts}</div><div style="font-size:10px;color:#64748b;letter-spacing:1px;text-transform:uppercase">Posts</div></div>
      <div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#fff">${isFollowing?'Você':'—'}</div><div style="font-size:10px;color:#64748b;letter-spacing:1px;text-transform:uppercase">Seguidores</div></div>
    </div>
    <button onclick="document.getElementById('user-profile-overlay').remove()" style="width:100%;padding:12px;background:transparent;border:1px solid #1e3a5f;border-radius:12px;color:#64748b;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif">Fechar</button>
  </div>`;

  document.body.appendChild(overlay);
}

function toggleFollow(userId, userName, btn){
  if(following.has(userId)){
    following.delete(userId);
    btn.textContent='+ Seguir';
    btn.classList.remove('following');
  } else {
    following.add(userId);
    btn.textContent='✓ Seguindo';
    btn.classList.add('following');
  }
  render(); // atualiza feed "Seguindo"
  // Reabrir o mini perfil para manter o overlay
  setTimeout(()=>openUserProfile(userName),10);
}

function followBtn(userName, size="sm"){
  const prof=USER_PROFILES[userName];
  if(!prof||userName==="Beto") return "";
  const isF=following.has(prof.id);
  const pad=size==="sm"?"padding:1px 8px;font-size:9px":"padding:3px 12px;font-size:11px";
  return `<button onclick="event.stopPropagation();(function(){if(following.has('${prof.id}')){following.delete('${prof.id}');}else{following.add('${prof.id}');}render();})()" style="${pad};border-radius:8px;border:1px solid ${isF?'#3b82f6':'#1e3a5f'};background:${isF?'#3b82f6':'transparent'};color:${isF?'#fff':'#64748b'};font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap">${isF?'Seguindo':'+ Seguir'}</button>`;
}

function userAvatarHtml(user, size=36){
  const prof=USER_PROFILES[user];
  return `<div onclick="${prof?`openUserProfile('${user}')`:'return false'}" style="width:${size}px;height:${size}px;border-radius:50%;background:#1e3a5f;display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.45)}px;overflow:hidden;flex-shrink:0;cursor:${prof?'pointer':'default'}">${prof?prof.avatar:'B'}</div>`;
}

function submitComment(evId){
  const txt=document.getElementById("comment-text");
  if(!txt||!txt.value.trim()) return;
  if(!COMMENTS[evId]) COMMENTS[evId]=[];
  COMMENTS[evId].unshift({user:"Beto",avatar:userAvatar||"B",avatarIsPhoto:!!userAvatar,time:"agora",rating:state.commentRating||0,text:txt.value.trim(),likes:0});
  state.showComment=false;state.commentRating=0;
  render();
}

function submitPost(){
  const txt=document.getElementById("compose-text");
  if(!txt||!txt.value.trim()) return;
  const rating=state.postRating||0;
  FEED_POSTS.unshift({id:Date.now(),user:"Beto",avatar:userAvatar||"B",avatarIsPhoto:!!userAvatar,time:"agora",text:txt.value.trim(),evId:null,likes:0,comments:0,rating});
  txt.value="";
  const charEl=document.getElementById("compose-char2");
  if(charEl) charEl.textContent="0/280";
  state.postRating=0;
  render();
}

function bindEvents(){}
render();
